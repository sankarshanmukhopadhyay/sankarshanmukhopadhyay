      quality_validation:
        required: true
        evidence:
          type: github-workflow
          path: .github/workflows/quality.yml
          freshness: current-head
      composed_assurance_smoke:
        required: true
        evidence:
          type: github-workflow
          path: .github/workflows/combined-assurance-smoke.yml
          freshness: current-head
      portfolio_contract:
        required: true
        evidence:
          type: github-workflow
          path: .github/workflows/portfolio-contract.yml
