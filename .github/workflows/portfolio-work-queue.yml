name: Portfolio Work Queue

on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build live work queue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/portfolio_work_queue.py             --output-json artifacts/portfolio-work/portfolio-work-queue.json             --output-md artifacts/portfolio-work/index.md

      - name: Validate deterministic model against fixture
        run: python scripts/portfolio_work_queue.py --offline tests/fixtures/work-queue-evidence.json --check

      - name: Upload live execution evidence
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-work-queue
          path: artifacts/portfolio-work/
          retention-days: 30
