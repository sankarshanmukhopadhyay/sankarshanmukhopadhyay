name: Member status contract assurance

on:
  pull_request:
    paths:
      - "data/repository-status.yaml"
      - "schemas/project-status.schema.json"
      - "scripts/validate_member_status_contracts.py"
      - ".github/workflows/member-status-contracts.yml"
  push:
    branches: [main]
    paths:
      - "data/repository-status.yaml"
      - "schemas/project-status.schema.json"
      - "scripts/validate_member_status_contracts.py"
      - ".github/workflows/member-status-contracts.yml"
  schedule:
    - cron: "43 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: member-status-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyyaml jsonschema

      - name: Validate federated member status contracts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/validate_member_status_contracts.py

      - name: Upload contract assurance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member-status-contracts-${{ github.run_id }}
          path: reports/portfolio-assurance/member-status-contracts.json
          retention-days: 90
