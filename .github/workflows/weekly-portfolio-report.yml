name: Weekly portfolio report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/weekly_portfolio_report.py'
      - '.github/workflows/weekly-portfolio-report.yml'
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  propose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test reporting window
        run: python -m unittest tests.test_weekly_portfolio_report
      - name: Create repository-scoped publication token
        id: app-token
        env:
          APP_ID: ${{ secrets.PORTFOLIO_ASSURANCE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PORTFOLIO_ASSURANCE_APP_PRIVATE_KEY }}
        if: ${{ env.APP_ID != '' && env.APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PORTFOLIO_ASSURANCE_APP_ID }}
          private-key: ${{ secrets.PORTFOLIO_ASSURANCE_APP_PRIVATE_KEY }}
          owner: sankarshanmukhopadhyay
          repositories: sankarshanmukhopadhyay
      - name: Recover every missing completed week
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/weekly_portfolio_report.py --catch-up
      - name: Create reviewed publication proposal
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "Missing repository-scoped GitHub App token; cannot create a PR that triggers required checks."
            exit 1
          fi
          if [[ -z "$(git status --porcelain -- docs/weekly-reports reports/weekly)" ]]; then exit 0; fi
          branch="reports/weekly-${{ github.run_id }}-${{ github.run_attempt }}"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "Existing reporting branch; refusing duplicate proposal"; exit 1
          fi
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/weekly-reports reports/weekly
          git commit -s -m "docs(reports): propose recovered completed weekly reports"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "docs(reports): review completed weekly portfolio reports" --body "Generated missing completed weeks and rebuilt the archive index. The Markdown drafts and JSON ledgers are derived GitHub activity evidence only. Human review must validate completeness, meaning, source links and DCO before merge. Bot commits carry the bot's own DCO sign-off; no human certification is impersonated."
