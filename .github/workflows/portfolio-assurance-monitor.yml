name: Portfolio assurance monitor

on:
  push:
    branches:
      - main
    paths:
      - "config/portfolio-monitor/**"
      - "data/repository-status.yaml"
      - "scripts/portfolio_assurance/**"
      - "scripts/portfolio_assurance_monitor*.py"
      - ".github/workflows/portfolio-assurance-monitor.yml"
      - ".github/workflows/portfolio-assurance-evidence-merge.yml"
      - "docs/portfolio-assurance/operations.md"
      - "docs/portfolio-assurance/assurance-contracts.md"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-assurance-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate portfolio governance
        run: python scripts/validate_portfolio.py

      - name: Run monitor tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Create scoped portfolio issue token
        id: issue-token
        env:
          APP_ID: ${{ secrets.PORTFOLIO_ASSURANCE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PORTFOLIO_ASSURANCE_APP_PRIVATE_KEY }}
        if: ${{ env.APP_ID != '' && env.APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PORTFOLIO_ASSURANCE_APP_ID }}
          private-key: ${{ secrets.PORTFOLIO_ASSURANCE_APP_PRIVATE_KEY }}
          owner: sankarshanmukhopadhyay

      - name: Create repository-scoped publication token
        id: publication-token
        env:
          APP_ID: ${{ secrets.PORTFOLIO_ASSURANCE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PORTFOLIO_ASSURANCE_APP_PRIVATE_KEY }}
        if: ${{ env.APP_ID != '' && env.APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PORTFOLIO_ASSURANCE_APP_ID }}
          private-key: ${{ secrets.PORTFOLIO_ASSURANCE_APP_PRIVATE_KEY }}
          owner: sankarshanmukhopadhyay
          repositories: sankarshanmukhopadhyay

      - name: Collect evidence, evaluate assurance contracts, and generate reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORTFOLIO_ISSUE_TOKEN: ${{ steps.issue-token.outputs.token }}
        run: python scripts/portfolio_assurance_monitor_v3.py --publish-issues

      - name: Validate generated site links
        run: python scripts/check_internal_links.py

      - name: Upload assurance evidence
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-assurance-${{ github.run_id }}
          path: |
            reports/portfolio-assurance/latest.md
            reports/portfolio-assurance/latest-findings.json
            reports/portfolio-assurance/assurance-state.json
            reports/portfolio-assurance/finding-lifecycle.json
            reports/portfolio-assurance/findings/*.json
            reports/portfolio-assurance/findings/*.md
            reports/portfolio-assurance/history/*.md
          retention-days: 90

      - name: Publish changed evidence through a pull request
        env:
          GH_TOKEN: ${{ steps.publication-token.outputs.token }}
          PUBLICATION_BRANCH: automation/portfolio-assurance-evidence
        run: |
          changed_paths="$(git diff --name-only)"
          disallowed_paths="$(printf '%s\n' "$changed_paths" | grep -Ev '^(docs/portfolio-assurance/dashboard\.md|reports/portfolio-assurance/)' || true)"
          if [ -n "$disallowed_paths" ]; then
            echo "Refusing to publish changes outside the delegated assurance-evidence paths:"
            printf '%s\n' "$disallowed_paths"
            exit 1
          fi

          if git diff --quiet -- docs/portfolio-assurance/dashboard.md reports/portfolio-assurance; then
            echo "No assurance report changes to publish."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "Refusing to publish without the repository-scoped Portfolio Assurance App token."
            exit 1
          fi

          git config user.name "portfolio-assurance[bot]"
          git config user.email "portfolio-assurance[bot]@users.noreply.github.com"
          git checkout -B "$PUBLICATION_BRANCH"
          git add docs/portfolio-assurance/dashboard.md reports/portfolio-assurance
          git commit -m "chore(assurance): publish portfolio evidence"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${PUBLICATION_BRANCH}"

          existing_pr="$(gh pr list --head "$PUBLICATION_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base main \
              --head "$PUBLICATION_BRANCH" \
              --title "chore(assurance): publish portfolio evidence" \
              --body "Automated portfolio-assurance evidence publication.\n\nAuthority boundary: this PR may modify only \`docs/portfolio-assurance/dashboard.md\` and \`reports/portfolio-assurance/**\`. Merge remains subject to the repository's protected-main PR and required-check rules.\n\nSource workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            echo "Updated existing evidence PR #${existing_pr}."
          fi
