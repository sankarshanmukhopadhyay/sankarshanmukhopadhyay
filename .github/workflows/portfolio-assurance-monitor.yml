name: Portfolio assurance monitor

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-assurance-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate portfolio governance
        run: python scripts/validate_portfolio.py

      - name: Run monitor tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Create scoped portfolio issue token
        id: issue-token
        env:
          APP_ID: ${{ secrets.PORTFOLIO_ASSURANCE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PORTFOLIO_ASSURANCE_APP_PRIVATE_KEY }}
        if: ${{ env.APP_ID != '' && env.APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PORTFOLIO_ASSURANCE_APP_ID }}
          private-key: ${{ secrets.PORTFOLIO_ASSURANCE_APP_PRIVATE_KEY }}
          owner: sankarshanmukhopadhyay

      - name: Collect evidence, evaluate assurance contracts, and generate reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORTFOLIO_ISSUE_TOKEN: ${{ steps.issue-token.outputs.token }}
        run: python scripts/portfolio_assurance_monitor_v3.py --publish-issues

      - name: Validate generated site links
        run: python scripts/check_internal_links.py

      - name: Upload assurance evidence
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-assurance-${{ github.run_id }}
          path: |
            reports/portfolio-assurance/latest.md
            reports/portfolio-assurance/latest-findings.json
            reports/portfolio-assurance/assurance-state.json
            reports/portfolio-assurance/finding-lifecycle.json
            reports/portfolio-assurance/findings/*.json
            reports/portfolio-assurance/findings/*.md
            reports/portfolio-assurance/history/*.md
          retention-days: 90

      - name: Commit changed reports
        run: |
          if git diff --quiet -- docs/portfolio-assurance/dashboard.md reports/portfolio-assurance; then
            echo "No assurance report changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/portfolio-assurance/dashboard.md reports/portfolio-assurance
          git commit -m "chore(assurance): publish weekly portfolio evidence"
          git push
