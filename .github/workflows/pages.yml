name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build live Portfolio Work Queue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install pyyaml
          python scripts/portfolio_work_queue.py
          python scripts/portfolio_delivery_pulse.py

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/configure-pages@v5

      - name: Build site
        run: bundle exec jekyll build --trace

      - name: Verify generated site
        run: |
          test -f _site/index.html
          test -f _site/docs/portfolio-work/index.html
          test -f _site/docs/weekly-reports/index.html
          test -f _site/docs/weekly-reports/methodology.html
          test -f _site/docs/weekly-reports/2026/week-40.html
          test -f _site/docs/weekly-reports/2026/week-43.html
          grep -q "Weekly Portfolio Reports" _site/docs/weekly-reports/index.html
          for source in docs/weekly-reports/20*/week-*.md; do
            test -f "_site/${source%.md}.html" || { echo "Missing rendered report: $source"; exit 1; }
          done
          test -f _site/data/portfolio-delivery-pulse.json
          grep -R "Portfolio Work Queue" _site/docs/portfolio-work/index.html >/dev/null
          grep -R "Portfolio delivery pulse" _site/docs/portfolio-work/index.html >/dev/null
          grep -R "mermaid-init.js" _site >/dev/null

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
