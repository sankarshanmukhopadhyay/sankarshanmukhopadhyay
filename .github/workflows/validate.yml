name: Portfolio validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate portfolio governance
        run: python scripts/validate_portfolio.py

      - name: Validate monitor configuration and report generation
        run: python scripts/portfolio_assurance_monitor_v3.py --offline --check

      - name: Run monitor tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate internal links
        run: python scripts/check_internal_links.py

      - name: Validate site navigation
        run: python scripts/check_site_navigation.py
