schema_version: '0.1'
status: expanded-calibration
scope:
  basis: data/repository-status.yaml
  statement: >-
    This overlay refines the portfolio maturity register by recording evidence
    boundaries, next valid evidence gates and stop conditions. It does not replace
    repository classification, maturity, lifecycle, authority or review-date
    controls in data/repository-status.yaml.
controlled_vocabularies:
  portfolio_view: [personal-upstream-facing, qbf-institutional, shared]
  gate_state: [not-started, ready, waiting-external-evidence, blocked, complete]
  evidence_gate:
    - adoption-clarity
    - implementation-binding
    - independent-reproduction
    - assessment-result
    - non-synthetic-target
    - upstream-decision
    - release-evidence
    - usability-validation
    - maintenance-only
  stop_condition:
    - pause-until-external-evidence
    - pause-until-upstream-decision
    - pause-until-implementation-target
    - maintenance-only
    - continue-internal-hardening
principles:
  - name: evidence-before-expansion
    statement: >-
      New portfolio work should change adoption clarity, evidence quality,
      assessment readiness, implementation binding, independent reproducibility
      or documentation usability.
  - name: no-internal-overclaim
    statement: >-
      Repository-owned fixtures, documentation, or CI runs must not be promoted
      into independent reproduction, production assurance, ecosystem conformance,
      or consumer-safety claims.
  - name: explicit-stop-points
    statement: >-
      A repository is mature when it can state what evidence it cannot produce
      internally and what external gate is required next.
views:
  personal-upstream-facing:
    purpose: >-
      Tracks personal, experimental, upstream-facing and contribution-oriented
      work where the next gate may depend on upstream review, independent audit,
      or external implementation adoption.
  qbf-institutional:
    purpose: >-
      Tracks institutional, assurance, corpus, protocol and client-facing assets
      whose public claims must remain bounded by evidence and adoption state.
initial_calibration:
  - repository: digital-trust-failure-corpus
    owner: qbf-consulting
    portfolio_view: qbf-institutional
    repo_role: failure-corpus-and-assurance-workbench
    current_maturity_boundary: >-
      CPC-001 has repository-owned synthetic execution, CI-backed synthetic
      evidence and explicit gates for independent reproduction, RAHP assessment
      and non-synthetic target admission.
    claim_boundary: >-
      The corpus may claim executable synthetic evidence and evidence-gated
      readiness, but not independent reproduction, product safety, ARPA
      conformance, completed RAHP assessment or consumer usability validation.
    next_evidence_gate: [non-synthetic-target, independent-reproduction, assessment-result]
    gate_state: waiting-external-evidence
    stop_condition: pause-until-external-evidence
    external_dependency: >-
      Concrete implementation target, independent reviewer/environment or actual
      RAHP assessment execution.
    qbf_relevance: Core QBF assurance asset and failure-proposition workbench.
  - repository: rahp-toolkit
    owner: sankarshanmukhopadhyay
    portfolio_view: personal-upstream-facing
    repo_role: assessment-toolkit-and-evidence-controller
    current_maturity_boundary: >-
      Produces assessment artifacts, controller outputs and release-comparison
      evidence; further progress should be tied to concrete assessment targets,
      audit preparation or upstream convergence.
    claim_boundary: >-
      Tool output is assessment evidence, not automatic governance acceptance,
      interoperability certification or implementation approval.
    next_evidence_gate: [assessment-result, independent-reproduction, upstream-decision]
    gate_state: ready
    stop_condition: pause-until-external-evidence
    external_dependency: >-
      Independent audit, upstream RAHP decision, or concrete target assessment.
    qbf_relevance: Method source and possible assessment substrate; not itself a QBF client-facing claim.
  - repository: agent-registry-protocol
    owner: qbf-consulting
    portfolio_view: qbf-institutional
    repo_role: protocol-specification-for-agent-authority-control
    current_maturity_boundary: >-
      Candidate protocol semantics and documentation are available; stronger
      claims require implementation, interop or adoption evidence.
    claim_boundary: >-
      The protocol may describe authority, delegation and lifecycle semantics;
      it should not claim deployment safety or ecosystem adoption without evidence.
    next_evidence_gate: [implementation-binding, independent-reproduction, release-evidence]
    gate_state: ready
    stop_condition: pause-until-implementation-target
    external_dependency: Implementer, interop environment or adopter feedback.
    qbf_relevance: QBF protocol asset and candidate implementation target for assurance cases such as CPC-001.
  - repository: tswg-trust-registry-protocol
    owner: sankarshanmukhopadhyay
    portfolio_view: personal-upstream-facing
    repo_role: downstream-analysis-and-upstream-convergence-work
    current_maturity_boundary: >-
      Downstream synthesis can prepare upstream contributions, but authority for
      canonical protocol acceptance remains upstream.
    claim_boundary: >-
      Downstream analysis should not be presented as upstream acceptance,
      deployment readiness or conformance evidence.
    next_evidence_gate: [upstream-decision, implementation-binding]
    gate_state: waiting-external-evidence
    stop_condition: pause-until-upstream-decision
    external_dependency: Upstream maintainers or implementation target.
    qbf_relevance: Pattern source for registry assurance; not a QBF-owned institutional surface by default.
  - repository: trust-protocol-interop-lab
    owner: sankarshanmukhopadhyay
    portfolio_view: shared
    repo_role: interoperability-lab-and-experimental-composition-surface
    current_maturity_boundary: >-
      Can demonstrate experimental compositions and collect evidence, but does
      not by itself confer production interoperability or governance acceptance.
    claim_boundary: >-
      Lab success is bounded experimental evidence unless independently reproduced
      and tied to admitted implementation targets.
    next_evidence_gate: [implementation-binding, independent-reproduction, assessment-result]
    gate_state: ready
    stop_condition: pause-until-external-evidence
    external_dependency: External implementers, reviewers or admitted target systems.
    qbf_relevance: Potential shared evidence lab for QBF assurance propositions and personal upstream-facing experiments.
  - repository: open-national-digital-trust-framework
    owner: qbf-consulting
    portfolio_view: qbf-institutional
    repo_role: jurisdiction-neutral-digital-trust-framework
    current_maturity_boundary: >-
      Stable framework content can support reference, adoption discussion and
      jurisdiction-neutral design review. Further progress should be tied to
      adoption evidence, implementation use or formal review feedback.
    claim_boundary: >-
      The framework may be presented as a stable public artifact, but not as
      formally adopted by a jurisdiction or deployed by an authority without
      explicit external evidence.
    next_evidence_gate: [adoption-clarity, release-evidence]
    gate_state: waiting-external-evidence
    stop_condition: pause-until-external-evidence
    external_dependency: Adopter, reviewer, jurisdictional implementation or public deployment evidence.
    qbf_relevance: Core QBF institutional framework asset.
  - repository: governance-authority-assurance-metamodel
    owner: qbf-consulting
    portfolio_view: qbf-institutional
    repo_role: normative-governance-authority-model
    current_maturity_boundary: >-
      Candidate governance-authority semantics can support modeling, review and
      assurance alignment. Further progress should be tied to validation against
      concrete authority, delegation, enforcement or revocation cases.
    claim_boundary: >-
      The metamodel should not be claimed as a universal governance ontology,
      implementation standard or externally validated assurance model without
      independent review or implementation binding.
    next_evidence_gate: [assessment-result, implementation-binding, independent-reproduction]
    gate_state: ready
    stop_condition: pause-until-external-evidence
    external_dependency: External model review, implementation use or assurance case binding.
    qbf_relevance: Core QBF semantics asset for governance and authority assurance.
  - repository: trust-systems-meta-model
    owner: qbf-consulting
    portfolio_view: qbf-institutional
    repo_role: canonical-semantic-model
    current_maturity_boundary: >-
      Candidate canonical semantics can govern vocabulary alignment across the
      portfolio. The next valuable work is alignment evidence from dependent
      schemas, tools or assurance artifacts.
    claim_boundary: >-
      The model should not claim canonical status outside the governed portfolio
      or external ecosystems without explicit adoption or alignment evidence.
    next_evidence_gate: [implementation-binding, assessment-result, release-evidence]
    gate_state: ready
    stop_condition: pause-until-external-evidence
    external_dependency: Dependent schema alignment, external reviewer or adopter evidence.
    qbf_relevance: QBF semantic backbone for cross-repo interoperability.
  - repository: trust-infrastructure-schemas
    owner: qbf-consulting
    portfolio_view: qbf-institutional
    repo_role: portable-schema-contracts
    current_maturity_boundary: >-
      Candidate portable schema contracts can encode governance, evidence and
      relationship records. Further progress should produce validation, example
      instances or downstream conformance evidence.
    claim_boundary: >-
      Schema validity is not operational assurance, ecosystem conformance or
      adoption evidence unless tied to validated instances and consumers.
    next_evidence_gate: [implementation-binding, release-evidence, independent-reproduction]
    gate_state: ready
    stop_condition: continue-internal-hardening
    external_dependency: Downstream consumers, validation artifacts or interop examples.
    qbf_relevance: QBF machine-verifiable contract layer.
  - repository: trust-graph-artifacts
    owner: qbf-consulting
    portfolio_view: qbf-institutional
    repo_role: executable-governance-incubator
    current_maturity_boundary: >-
      Incubates executable governance patterns and negative-assurance tests.
      Further progress should be limited to patterns that can produce reusable
      artifacts, tests or adoption-ready examples.
    claim_boundary: >-
      Incubator artifacts should not be presented as stable controls, deployed
      governance infrastructure or independently validated assurance evidence.
    next_evidence_gate: [implementation-binding, adoption-clarity, release-evidence]
    gate_state: ready
    stop_condition: continue-internal-hardening
    external_dependency: Reusable examples, downstream adoption or test evidence.
    qbf_relevance: QBF pattern incubator and source for future governed assets.
  - repository: digital-governance-paper-notes
    owner: sankarshanmukhopadhyay
    portfolio_view: personal-upstream-facing
    repo_role: research-analysis-and-review-archive
    current_maturity_boundary: >-
      Stable research notes can support synthesis, issue commentary and concept
      discovery. The repository should remain a research archive unless a note is
      promoted into an executable framework, schema or assurance case elsewhere.
    claim_boundary: >-
      Paper review notes are not evidence of implementation validity, consensus,
      formal peer review by the portfolio, or QBF institutional position.
    next_evidence_gate: [maintenance-only, adoption-clarity]
    gate_state: ready
    stop_condition: maintenance-only
    external_dependency: New papers, explicit synthesis need or downstream promotion target.
    qbf_relevance: Background research source; not a QBF institutional assurance surface.
  - repository: kiranaos
    owner: sankarshanmukhopadhyay
    portfolio_view: personal-upstream-facing
    repo_role: applied-product-and-domain-demonstrator
    current_maturity_boundary: >-
      Applied product work can demonstrate domain design patterns, but further
      work should be driven by user, deployment or issue-template feedback rather
      than speculative internal expansion.
    claim_boundary: >-
      Product-roadmap completion should not be treated as deployment evidence,
      user validation or operational readiness without external use evidence.
    next_evidence_gate: [usability-validation, adoption-clarity, implementation-binding]
    gate_state: waiting-external-evidence
    stop_condition: pause-until-external-evidence
    external_dependency: User feedback, deployment candidate or concrete issue report.
    qbf_relevance: Adjacent applied learning surface; not core QBF trust-infrastructure evidence.
