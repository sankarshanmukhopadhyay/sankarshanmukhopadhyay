  - trqp-assurance-hub
  dtg-composed-privacy:
  - dtgwg-zkp-tf
  - rahp-toolkit
  - dtg-privacy-implementation-profile
  - dtg-conformance-assurance
  ecosystem-observation:
  - trust-ecosystem-monitor
  - dtg-portfolio-monitor
  - uncefact-portfolio-monitor
  national-digital-trust-framework:
    core:
    - open-national-digital-trust-framework
    optional-semantic-accelerator:
    - trust-systems-meta-model
    optional-schema-accelerator:
    - trust-infrastructure-schemas
    assurance:
    - dtg-conformance-assurance
