schema_version: '2.0'
architecture_model: five-plane-with-assurance-feedback
relationship_types:
- normative-dependency
- informative-alignment
- supports
- profiles
- implements
- tested-by
- evaluated-by
- produces-evidence-for
- assurance-feedback-to
- incubates
- fork-of
- nominates-review-for
authorities:
  governance_authority_assurance_model: governance-authority-assurance-metamodel
  canonical_semantics: trust-systems-meta-model
  portable_schema_contracts: trust-infrastructure-schemas
  governance_patterns: trust-graph-artifacts
  agent_registry_protocol: agent-registry-protocol
  portfolio_classification: sankarshanmukhopadhyay
relationship_contract:
  authority: trust-infrastructure-schemas
  version: v0.13.0
  schema: https://raw.githubusercontent.com/sankarshanmukhopadhyay/trust-infrastructure-schemas/v0.13.0/portfolio/portfolio-relationship.schema.json
  semantic_authority:
    repository: trust-systems-meta-model
    reviewed_version: v0.24.0
  classification_authority:
    repository: sankarshanmukhopadhyay
planes:
  frameworks-and-adoption:
  - open-national-digital-trust-framework
  governance-and-semantics:
  - governance-authority-assurance-metamodel
  - trust-systems-meta-model
  - trust-infrastructure-schemas
  - trust-graph-artifacts
  - trust-infrastructure-glossary
  protocols-and-profiles:
  - agent-registry-protocol
  - agent-name-assurance-baseline
  - TRQP-TSPP
  - ERC-8004-CSP
  implementations-and-operational-systems:
  - cawg-trqp-verifier-refimpl
  - kiranaos
  - dpi-ai-governance-lab
  - trust-ecosystem-monitor
  - uncefact-portfolio-monitor
  conformance-evidence-and-assurance:
  - trqp-conformance-suite
  - trqp-assurance-hub
  - dtg-conformance-assurance
  - rahp-toolkit
  - dtg-privacy-implementation-profile
  upstream-derived-collaboration:
  - agtp
  - dtgwg-zkp-tf
  - dtgwg-cred-tf
  - tswg-trust-registry-protocol
relationships:
- from: open-national-digital-trust-framework
  to: governance-authority-assurance-metamodel
  type: informative-alignment
  constraint: ONDTF may apply GAAM governance, authority, and assurance concepts without transferring framework or release authority.
- from: open-national-digital-trust-framework
  to: trust-systems-meta-model
  type: supports
  constraint: TSMM is an optional semantic formalisation accelerator and is not a mandatory ONDTF dependency.
- from: open-national-digital-trust-framework
  to: trust-infrastructure-schemas
  type: supports
  constraint: TIS provides optional portable schema contracts while ONDTF permits alternative conforming representations.
- from: open-national-digital-trust-framework
  to: dtg-conformance-assurance
  type: evaluated-by
  constraint: Assurance evaluation must preserve jurisdiction, profile, implementation, evidence, and decision provenance.
- from: trust-infrastructure-schemas
  to: trust-systems-meta-model
  type: normative-dependency
  constraint: TIS derives canonical semantic meaning from TSMM but retains authority over schema design, identifiers, serialization, validation contracts, and releases.
  contract:
    semantics: canonical
    serialization: independent
  verification:
    source: trust-infrastructure-schemas
    artifact: artifacts/portfolio/portfolio-alignment.json
- from: trust-systems-meta-model
  to: governance-authority-assurance-metamodel
  type: informative-alignment
  constraint: Semantic alignment creates no shared normative or release authority.
- from: trust-systems-meta-model
  to: trust-infrastructure-schemas
  type: informative-alignment
  constraint: Schema implementations must not silently redefine canonical semantics.
  contract:
    semantics: canonical
    serialization: independent
  verification:
    source: trust-systems-meta-model
    artifact: artifacts/portfolio/portfolio-alignment.json
- from: trust-infrastructure-schemas
  to: trust-graph-artifacts
  type: supports
  constraint: Portable contracts remain authoritative in their source repository.
- from: governance-authority-assurance-metamodel
  to: agent-registry-protocol
  type: informative-alignment
  constraint: The protocol retains domain-specific normative authority and adoption decisions.
- from: trust-infrastructure-schemas
  to: agent-name-assurance-baseline
  type: supports
  constraint: Agent naming claims preserve schema and baseline authority boundaries.
- from: TRQP-TSPP
  to: trqp-conformance-suite
  type: tested-by
  constraint: Profile requirements require traceable conformance coverage.
- from: cawg-trqp-verifier-refimpl
  to: trqp-conformance-suite
  type: evaluated-by
  constraint: Reference status does not replace independent conformance evidence.
- from: trqp-conformance-suite
  to: trqp-assurance-hub
  type: produces-evidence-for
  constraint: Assurance conclusions retain test, implementation, and provenance records.
- from: trqp-assurance-hub
  to: TRQP-TSPP
  type: assurance-feedback-to
  constraint: Findings inform correction but do not modify normative content automatically.
- from: dtg-conformance-assurance
  to: trust-graph-artifacts
  type: assurance-feedback-to
  constraint: Assurance findings are recorded as evidence-backed improvement inputs.
- from: dtgwg-zkp-tf
  to: trustoverip/dtgwg-zkp-tf
  type: fork-of
  constraint: The fork retains no upstream governance or release authority; fork-local implementation, risk, deployment, and learning artefacts must preserve explicit upstream attribution.
- from: agtp
  to: nomoticai/agtp
  type: fork-of
  constraint: The fork conveys no authority over upstream governance, releases, or adoption.
- from: dtgwg-cred-tf
  to: trustoverip/dtgwg-cred-tf
  type: fork-of
  constraint: The fork conveys no authority over upstream governance, releases, or adoption.
- from: tswg-trust-registry-protocol
  to: trustoverip/tswg-trust-registry-protocol
  type: fork-of
  constraint: Protocol authority remains with the upstream project.
- from: conformance-test-suite
  to: trustoverip/conformance-test-suite
  type: fork-of
  constraint: The fork is a reference and contribution surface only.
- from: A2A
  to: a2aproject/A2A
  type: fork-of
  constraint: Upstream retains specification and release authority.
- from: awesome-8004
  to: erc-8004/awesome-8004
  type: fork-of
  constraint: The fork does not imply ownership of the upstream collection.
- from: TokenTaxonomyFramework
  to: InterWorkAlliance/TokenTaxonomyFramework
  type: fork-of
  constraint: Upstream retains normative and release authority.
- from: DHP-Specs
  to: trustoverip/DHP-Specs
  type: fork-of
  constraint: Retained as a historical upstream-derived reference.
- from: trust-graph-artifacts
  to: trust-systems-meta-model
  type: normative-dependency
  constraint: TGA packages use TSMM canonical semantics. TGA may incubate candidate concepts but cannot modify or supersede TSMM semantics.
- from: trust-graph-artifacts
  to: trust-systems-meta-model
  type: incubates
  constraint: Stable cross-domain epistemic-governance concepts may be proposed through TSMM governance. Incubation creates no canonical semantic authority.
- from: PolicyMesh
  to: governance-authority-assurance-metamodel
  type: informative-alignment
  constraint: PolicyMesh may consume GAAM governance and authority concepts but does not establish external mandate legitimacy or modify GAAM semantics.
- from: PolicyMesh
  to: trust-systems-meta-model
  type: informative-alignment
  constraint: PolicyMesh may map policy decisions to TSMM concepts but cannot redefine TSMM canonical semantics.
- from: PolicyMesh
  to: trust-protocol-interop-lab
  type: evaluated-by
  constraint: Interop Lab experiments may test PolicyMesh compositions; experimental results do not confer policy authority or certification.
- from: dtg-portfolio-monitor
  to: trust-protocol-interop-lab
  type: nominates-review-for
  constraint: Portfolio change and convergence signals may nominate interoperability questions for human review but cannot automatically admit cases or create interoperability claims.
- from: trust-protocol-interop-lab
  to: rahp-toolkit
  type: evaluated-by
  constraint: Consequential interoperability cases may receive portable RAHP pressure testing; findings do not alter reviewed specifications or governance automatically.
- from: rahp-toolkit
  to: dtg-conformance-assurance
  type: supports
  constraint: RAHP risk, harm, guardrail, and security findings complement conformance evidence and do not substitute for specification conformance testing.
- from: rahp-toolkit
  to: dtg-privacy-implementation-profile
  type: nominates-review-for
  constraint: RAHP findings may nominate privacy-sensitive compositions for DPIP evaluation; nomination is not a privacy-conformance result.
- from: dtg-privacy-implementation-profile
  to: dtg-conformance-assurance
  type: produces-evidence-for
  constraint: DPIP may produce composed-interaction privacy evidence for broader assurance while retaining authority over its privacy invariants, profiles, findings, and evidence semantics.
- from: dtgwg-zkp-tf
  to: dtg-privacy-implementation-profile
  type: evaluated-by
  constraint: DPIP may evaluate privacy properties of composed interactions using ZKP component behaviour as input evidence; evaluation transfers no normative authority over the ZKP specification.
- from: trust-ecosystem-monitor
  to: dtg-portfolio-monitor
  type: supports
  constraint: Reusable monitoring infrastructure may support DTG observation while DTG Portfolio Monitor retains authority over its scope, signals, releases, and evidence.
- from: trust-ecosystem-monitor
  to: uncefact-portfolio-monitor
  type: supports
  constraint: Reusable monitoring infrastructure may support the UN/CEFACT deployment without transferring authority over UN/CEFACT repositories, governance, classifications, or releases.
- from: uncefact-portfolio-monitor
  to: trust-ecosystem-monitor
  type: assurance-feedback-to
  constraint: Deployment findings may improve reusable monitoring infrastructure but cannot silently change its contracts or governance.
- from: dtgwg-rahp-tf
  to: trustoverip/dtgwg-rahp-tf
  type: fork-of
  constraint: The fork retains no upstream governance or release authority; fork-local assurance tooling, pressure tests, security reviews, and adoption guidance must preserve explicit upstream attribution.
- from: trust-infrastructure-glossary
  to: trust-systems-meta-model
  type: informative-alignment
  constraint: The glossary may align terminology with TSMM concepts while retaining independent terminology governance and release authority.
external_repositories:
- name: trustoverip/dtgwg-zkp-tf
  kind: upstream
- name: nomoticai/agtp
  kind: upstream
- name: trustoverip/dtgwg-cred-tf
  kind: upstream
- name: trustoverip/tswg-trust-registry-protocol
  kind: upstream
- name: trustoverip/conformance-test-suite
  kind: upstream
- name: a2aproject/A2A
  kind: upstream
- name: erc-8004/awesome-8004
  kind: upstream
- name: InterWorkAlliance/TokenTaxonomyFramework
  kind: upstream
- name: trustoverip/DHP-Specs
  kind: upstream
- name: trustoverip/dtgwg-rahp-tf
  authority: upstream
