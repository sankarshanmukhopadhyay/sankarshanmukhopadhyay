owner: sankarshanmukhopadhyay
purpose: Machine-readable relationship model for the public trust infrastructure portfolio. This file records operational
  repository relationships, evidence expectations, and drift review triggers so cross-repo changes can be reviewed
  as executable governance infrastructure rather than narrative alignment alone.
relationship_types:
  informs: Provides conceptual vocabulary, model structure, or design logic.
  depends_on: Requires artifacts, schemas, examples, workflows, or outputs from another repository.
  profiles: Defines an assurance, governance, security, or implementation profile for another layer.
  validates: Provides tests, checks, conformance logic, or verification workflows.
  produces_evidence_for: Generates outputs that another repository or assurance process can consume.
  extends: Adds a domain-specific layer to a more general model.
  binds_to: Connects a portfolio concept to an external standard, ecosystem, or protocol.
  references: Cites or points to another repository without an operational dependency.
  drift_sensitive_to: Should be reviewed when another repository changes.
  orchestrates: Coordinates adoption, onboarding, compatibility, evidence intake, or assurance workflow.
  consumes_evidence_from: Consumes conformance, assurance, decision, or evidence outputs.
  consumes_profile_from: Consumes assurance, control, governance, or security profile expectations.
