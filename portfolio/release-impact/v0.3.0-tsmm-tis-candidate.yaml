schema_version: "1.0"
capability: tsmm-tis-candidate-publication
review_date: "2026-07-20"
participating_repositories:
  - repository: trust-systems-meta-model
    version: 0.23.0
    change: candidate-publication-and-assurance
  - repository: trust-infrastructure-schemas
    version: 0.12.0
    change: candidate-promotion-and-validation-repair
  - repository: sankarshanmukhopadhyay
    version: 0.3.0
    change: portfolio-status-and-topology-alignment
authoritative_inputs:
  - TSMM PROJECT-STATUS.yaml
  - TIS PROJECT-STATUS.yaml
  - portfolio controlled vocabularies
validation:
  - member status contracts validate
  - repository relationships use controlled vocabulary
  - all three GitHub Pages sites build
  - Mermaid diagrams parse and render
evidence_outputs:
  - TSMM Candidate evidence bundle
  - TIS Candidate evidence bundle
  - portfolio validation report
rollback:
  condition: any member validation or Pages build fails
  action: retain prior maturity declaration and do not publish coordinated releases
